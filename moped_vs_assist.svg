<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" font-family="Noto Sans CJK JP, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="840" height="500" fill="#ffffff"/>

  <!-- ===== 左：電動アシスト自転車 ===== -->
  <rect x="10" y="10" width="405" height="480" rx="18" fill="#eef7ee" stroke="#3a9a4a" stroke-width="3"/>
  <text x="212" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#1e6b2b">でんどうアシスト自転車</text>
  <text x="212" y="82" text-anchor="middle" font-size="18" fill="#1e6b2b">Sepeda listrik bantu kayuh</text>

  <g stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="105" cy="300" r="62"/>
    <circle cx="320" cy="300" r="62"/>
    <!-- frame -->
    <path d="M105 300 L180 300 L150 210 Z"/>
    <path d="M180 300 L290 215 L150 210"/>
    <path d="M290 215 L320 300"/>
    <!-- seat post & seat -->
    <path d="M150 210 L142 182"/>
    <path d="M122 180 L165 180" stroke-width="9"/>
    <!-- handle -->
    <path d="M290 215 L282 170 L305 165"/>
    <!-- pedal -->
    <circle cx="180" cy="300" r="12"/>
    <path d="M180 300 L196 322"/>
  </g>
  <!-- basket -->
  <rect x="300" y="175" width="52" height="36" rx="4" fill="none" stroke="#333" stroke-width="4"/>
  <!-- battery -->
  <rect x="150" y="226" width="26" height="62" rx="5" fill="#3a9a4a" transform="rotate(-20 163 257)"/>
  <text x="30" y="150" font-size="16" fill="#1e6b2b" font-weight="700">バッテリー</text><line x1="70" y1="156" x2="155" y2="235" stroke="#1e6b2b" stroke-width="2"/>

  <!-- checklist -->
  <g font-size="18" fill="#222">
    <text x="30" y="400">● ペダルを こぐと、モーターが たすける</text>
    <text x="30" y="428">● ナンバープレート なし</text>
    <text x="30" y="456">● めんきょ いらない ＝ 自転車</text>
  </g>

  <!-- ===== 右：モペット ===== -->
  <rect x="425" y="10" width="405" height="480" rx="18" fill="#fdecec" stroke="#c83232" stroke-width="3"/>
  <text x="627" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#a11d1d">モペット</text>
  <text x="627" y="82" text-anchor="middle" font-size="18" fill="#a11d1d">Sepeda motor listrik berpedal</text>

  <g stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="520" cy="300" r="58"/>
    <circle cx="735" cy="300" r="58"/>
    <!-- thick frame -->
    <path d="M520 300 L600 300 L705 215" stroke-width="9"/>
    <path d="M705 215 L735 300" stroke-width="7"/>
    <path d="M565 210 L600 300" stroke-width="7"/>
    <!-- long seat -->
    <path d="M520 205 L620 205" stroke-width="12"/>
    <!-- handle -->
    <path d="M705 215 L698 168 L725 162"/>
    <!-- pedal -->
    <circle cx="600" cy="300" r="12"/>
    <path d="M600 300 L616 322"/>
    <!-- mirror -->
    <path d="M700 168 L690 135"/>
  </g>
  <ellipse cx="688" cy="128" rx="14" ry="9" fill="#9ec5e8" stroke="#333" stroke-width="3"/>
  <!-- motor box / battery -->
  <rect x="610" y="232" width="62" height="40" rx="6" fill="#555"/>
  <!-- headlight -->
  <circle cx="738" cy="196" r="11" fill="#ffe066" stroke="#333" stroke-width="3"/>
  <!-- number plate -->
  <rect x="470" y="212" width="54" height="34" rx="3" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <text x="497" y="235" text-anchor="middle" font-size="12" fill="#333">あ 12-34</text>
  <!-- accelerator highlight -->
  <circle cx="725" cy="162" r="14" fill="none" stroke="#c83232" stroke-width="3" stroke-dasharray="4 3"/>

  <!-- callouts -->
  <g font-size="15" fill="#a11d1d" font-weight="700">
    <text x="440" y="126">ナンバー</text>
    <line x1="470" y1="132" x2="490" y2="210" stroke="#a11d1d" stroke-width="2"/>
    <text x="640" y="112">ミラー</text>
    <text x="752" y="150">アクセル</text>
  </g>

  <g font-size="18" fill="#222">
    <text x="445" y="400">● こがなくても 走る（アクセル）</text>
    <text x="445" y="428">● ナンバープレート あり</text>
    <text x="445" y="456">● めんきょが ひつよう ＝ バイク</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
